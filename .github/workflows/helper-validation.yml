name: Validate build inputs
on:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check deployment scripts and Docker build inputs
        run: |
          test -f website/pnpm-lock.yaml
          test -f website/Dockerfile
          bash -n .github/scripts/app-deploy.sh
