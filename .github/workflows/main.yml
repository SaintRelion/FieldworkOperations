name: Main release
on:
  push:
    branches: [main]
    # Documentation does not change either application image.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_images:
        description: Publish application images after validation
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: build-release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/helper-validation.yml
  publish:
    name: Publish ${{ matrix.component }}
    needs: validate
    # Explicit opt-out still runs validation. Use only when no new image is needed.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.build_images) && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip build]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [website]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify release and preserve an existing SHA tag on retries
        id: release
        env:
          COMPONENT: ${{ matrix.component }}
          WEBSITE_IMAGE_NAME: ${{ vars.WEBSITE_IMAGE_NAME }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="${WEBSITE_IMAGE_NAME:-ghcr.io/$owner/fieldwork-operations-website}"
          [[ "$image" =~ ^ghcr.io/[a-z0-9_./-]+$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image:$GITHUB_SHA" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish committed release
        if: steps.release.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ github.sha }}
          secrets: |
            sr_react_github_token=${{ secrets.SR_REACT_GITHUB_TOKEN }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Report exact published image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" | awk '$1 == "Digest:" && !found { print $2; found=1 }')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "### $IMAGE"
            echo "Release: $GITHUB_SHA"
            echo "Image: $IMAGE:$GITHUB_SHA"
            echo "Pinned image: $IMAGE@$digest"
            echo 'Promote this SHA using the Deploy existing release workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
  production:
    name: Deploy FieldworkOperations
    needs: publish
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/helper-deploy.yml
    with:
      environment: production
      sha: ${{ github.sha }}
    secrets: inherit
