apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fieldwork-operations
resources:
  - ../base
patches:
  - target:
      kind: Ingress
      name: fieldwork-operations
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: fieldwork-operations.srecosystem.space
      - op: replace
        path: /spec/tls/0/hosts/0
        value: fieldwork-operations.srecosystem.space
